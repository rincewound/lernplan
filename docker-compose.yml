version: "3.9"

services:
  web:
    build:
      context: .
    container_name: lernplan-web
    working_dir: /app
    ports:
      - "8081:8000"
    environment:
      DJANGO_SETTINGS_MODULE: learning_plan.settings
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - lernplan_data:/data

volumes:
  lernplan_data:
