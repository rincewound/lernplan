version: "3.9"

services:
  web:
    build:
      context: .
    container_name: lernplan-web
    ports:
      - "8081:8000"
    environment:
      DJANGO_SETTINGS_MODULE: learning_plan.settings
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py seed_demo_data &&
      python manage.py runserver 0.0.0.0:8000"
